# Synthetic data generation / augmentation configuration

# -----------------------------------------------------------------------------
# DATA paths
# -----------------------------------------------------------------------------
DATA:
  # Path to the original human response file (CSV/XLSX supported by the loader).
  HUMAN_DATA_PATH: "./PSRP Dataset/Human Data/Human-Data-en.xlsx"

  # PSRP original questionnaire list
  QUESTION_JSON_PATH: "./Code/Data/Human-Data-Question-list.json"

  # Newly augmented questions (the pool to be answered)
  # NOTE: update this file name if you use a different augmented question set.
  QUESTION_NEW_JSON_PATH: "./Code/Data/Augment_Question.json"

  # Output directory for generated synthetic data
  OUTPUT_DIR: "./outputs/syndata"

# -----------------------------------------------------------------------------
# Profile fields
# -----------------------------------------------------------------------------
PROFILE:
  COLUMNS: ["您的性别：", "您的年龄段：", "您的学历：", "您目前从事的职业：", "您的年收入情况："]

# -----------------------------------------------------------------------------
# Neighbor retrieval (used in profile-based augmentation)
# -----------------------------------------------------------------------------
NEIGHBOR_RETRIEVAL:
  MAX_NEIGHBORS: 15  
  NEIGHBOR_THRESHOLD: 5  
  REAL_RATIO_THRESHOLD: 1 

# -----------------------------------------------------------------------------
# Multi-round augmentation schedule
# -----------------------------------------------------------------------------
ROUNDS:
  - round: 1
    max_neighbors: 10
    neighbor_threshold: 3
    real_ratio_threshold: 1
    use_synthetic: false
  - round: 2
    max_neighbors: 15
    neighbor_threshold: 5
    real_ratio_threshold: 0.7
    use_synthetic: true
  - round: 3
    max_neighbors: 15
    neighbor_threshold: 8
    real_ratio_threshold: 0.8
    use_synthetic: true

# -----------------------------------------------------------------------------
# LLM API (OpenAI-compatible)
# -----------------------------------------------------------------------------
LLM:
  API_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  API_KEY: "YOUR_API_KEY"
  MODEL: "qwen-plus"
  MAX_TOKENS: 8296
  TEMPERATURE: 0.7
  TIMEOUT: 30
  MAX_RETRIES: 3
  RETRY_DELAY: 2

# -----------------------------------------------------------------------------
# Threading
# -----------------------------------------------------------------------------
THREADING:
  NUM_WORKERS: 5
  QUEUE_SIZE: 100

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
LOGGING:
  LOG_DIR: "./Code/SynDataCode/logs"
  LOG_LEVEL: "INFO"